<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-1.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Digital Clock</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>digital clock</h1>
      </header>

      <main>
        <div class="clock-display">
          <p>
            <span id="hours"></span><span>:</span><span id="minutes"></span
            ><span>:</span><span id="seconds"></span><span id="session"></span>
          </p>
          <div id="day" class="day"></div>
        </div>
      </main>

      <!-- copyright info -->
      <footer>
        <div id="copy" class="copy"></div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
